<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>
  
  <!-- Checklist icon -->
  <rect x="25" y="20" width="50" height="60" rx="5" fill="white" opacity="0.95"/>
  
  <!-- Checkmarks -->
  <path d="M 32 35 L 37 40 L 45 30" stroke="#4caf50" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 32 50 L 37 55 L 45 45" stroke="#2196f3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 32 65 L 37 70 L 45 60" stroke="#9c27b0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Lines next to checkmarks -->
  <line x1="50" y1="35" x2="68" y2="35" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="68" y2="50" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="68" y2="65" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
